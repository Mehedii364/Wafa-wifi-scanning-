name: Android Build & APK Generation

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Real Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate & Verify Debug APK Output
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: assembleDebug failed to produce an APK."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK Size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -le 100000 ]; then
            echo "❌ ERROR: APK file size is suspiciously small ($FILE_SIZE bytes)."
            exit 1
          fi

          # Prepare output directories
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          # Copy real APK
          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          # Validate zip structure
          unzip -t APK_DOWNLOAD/app-debug.apk

          # Verify SHA256 integrity
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "SHA256 (.build-outputs): $HASH1"
          echo "SHA256 (APK_DOWNLOAD):   $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "❌ ERROR: SHA256 mismatch between destination copies."
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit Generated APK to Repository
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk
          git add -f APK_DOWNLOAD/app-debug.apk
          git diff --cached --quiet || git commit -m "build: update debug APK [skip ci]"
          git push || echo "Push skipped or branch protected."
